version: '3.8'

services:
  github-actions:
    image: yesyunxin/github-actions:latest
    container_name: github-actions
    restart: unless-stopped
    ports:
      - "8000:8000"             # 外部访问端口:容器内部端口
    volumes:
      - ./data:/app/data        # 数据库持久化
      - ./scripts:/app/scripts  # 脚本文件持久化
    environment:
      - TZ=Asia/Shanghai

      # 自定义管理员密码 (建议修改)
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin

      # JWT 加密密钥 (生产环境请务必修改为长随机字符串)
      - JWT_SECRET=change_this_to_a_secure_random_string

      # 连接 MariaDB（外部数据库）
      # 格式: mysql+pymysql://用户名:密码@数据库地址:端口/数据库名
    # - DATABASE_URL=mysql+pymysql://root:my-secret-pw@192.168.1.100:3306/github_actions_db
